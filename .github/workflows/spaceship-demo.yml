name: Record Spaceship Writer demo
on:
  push:
    branches: [demo/backbone-screencast]
    paths: [.github/workflows/spaceship-demo.yml, scripts/record-spaceship-demo.mjs]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:extension
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg xvfb openbox
      - run: xvfb-run -a -s '-screen 0 1440x960x24' bash -c 'openbox & node scripts/record-spaceship-demo.mjs'
      - uses: actions/upload-artifact@v4
        with:
          name: spaceship-demo-linux
          path: demo-evidence/
          if-no-files-found: error
        if: always()
