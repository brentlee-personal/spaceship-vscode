name: Build VS Code extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:extension
      - name: Real VS Code Extension Host smoke
        run: xvfb-run -a npm run test:extension-host
        timeout-minutes: 5
      - name: Isolated same-job installed VSIX smoke
        run: xvfb-run -a npm run test:installed-extension
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: spaceship-writer-vsix
          path: extension/*.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: installed-vsix-evidence
          path: test-evidence/installed-vsix.json
          if-no-files-found: error
